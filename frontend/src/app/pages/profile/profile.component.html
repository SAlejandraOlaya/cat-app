<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-md mx-auto">

    <div class="flex items-center justify-between mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Profile</h1>
      <a routerLink="/home" class="text-blue-600 hover:underline text-sm">Back to Home</a>
    </div>

    <div *ngIf="user" class="bg-white rounded-lg shadow-md p-6">
      <div class="flex items-center justify-center mb-6">
        <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center text-white text-3xl font-bold">
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
      </div>

      <div class="space-y-4">
        <div class="bg-gray-50 p-4 rounded">
          <span class="text-sm font-semibold text-gray-500">Name</span>
          <p class="text-gray-800 text-lg">{{ user.name }}</p>
        </div>

        <div class="bg-gray-50 p-4 rounded">
          <span class="text-sm font-semibold text-gray-500">Email</span>
          <p class="text-gray-800 text-lg">{{ user.email }}</p>
        </div>
      </div>

      <button
        (click)="onLogout()"
        class="w-full mt-6 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition"
      >
        Logout
      </button>
    </div>

  </div>
</div>
