@if (images().length > 0 && currentImage()) {
  <div class="relative rounded-2xl overflow-hidden shadow-xl bg-gray-900">
    <img
      [src]="currentImage()!.url"
      [alt]="altText()"
      class="w-full h-[28rem] object-contain"
    />

    <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>

    <ng-content></ng-content>

    <button
      (click)="prev()"
      class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/90 text-gray-800 w-10 h-10 rounded-full hover:bg-white transition shadow-lg flex items-center justify-center"
    >
      &#8249;
    </button>

    <button
      (click)="next()"
      class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/90 text-gray-800 w-10 h-10 rounded-full hover:bg-white transition shadow-lg flex items-center justify-center"
    >
      &#8250;
    </button>

    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2">
      @for (img of images(); track img.id; let i = $index) {
        <span
          (click)="goTo(i)"
          class="w-2.5 h-2.5 rounded-full cursor-pointer transition"
          [ngClass]="i === currentIndex() ? 'bg-white scale-125' : 'bg-white/50'"
        ></span>
      }
    </div>
  </div>
}
