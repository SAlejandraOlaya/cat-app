<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50">

  <app-navbar [isLoggedIn]="isLoggedIn()" [userName]="userName()" />

  <div class="max-w-md mx-auto px-4 sm:px-6 py-8">

    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 mb-6">Profile</h1>

    @if (user) {
      <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
        <div class="flex items-center justify-center mb-6">
          <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-purple-600 rounded-full flex items-center justify-center text-white text-3xl font-bold shadow-md">
            {{ user.name.charAt(0).toUpperCase() }}
          </div>
        </div>

        <div class="space-y-4">
          <div class="bg-gray-50 p-4 rounded-xl">
            <span class="text-xs font-semibold text-gray-500 uppercase">Name</span>
            <p class="text-gray-800 text-lg font-medium">{{ user.name }}</p>
          </div>

          <div class="bg-gray-50 p-4 rounded-xl">
            <span class="text-xs font-semibold text-gray-500 uppercase">Email</span>
            <p class="text-gray-800 text-lg font-medium">{{ user.email }}</p>
          </div>
        </div>

        <button
          (click)="onLogout()"
          class="w-full mt-6 bg-red-600 text-white py-2.5 rounded-xl hover:bg-red-700 transition font-medium shadow-sm"
        >
          Logout
        </button>
      </div>
    }

  </div>
</div>
